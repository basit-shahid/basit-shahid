<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Abdul Basit Shahid — software engineering student and backend developer</title>
  <desc id="desc">Abdul Basit Shahid. Backend thinker. Deliberate builder. Laravel, PHP, and problem solving. Lahore, Pakistan. A subtly animated architectural illustration connects interface, logic, and data.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#f7f8f3"/><stop offset="1" stop-color="#e9eee4"/></linearGradient>
    <linearGradient id="surface" x2=".9" y2="1"><stop stop-color="#f5f8f4"/><stop offset="1" stop-color="#dbe4dd"/></linearGradient>
    <linearGradient id="core" x2="1" y2="1"><stop stop-color="#5c8e25"/><stop offset="1" stop-color="#3b6a14"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#3d6e9c" stroke-opacity=".055"/></pattern>
    <clipPath id="rounded"><rect width="1200" height="440" rx="20"/></clipPath>
  </defs>
  <style>
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
    .sans { font-family: Arial, Helvetica, sans-serif; }
    .upper { animation: rise 8s ease-in-out infinite; }
    .signal { animation: transmit 6s linear infinite; }
    .cursor { animation: glow 4s ease-in-out infinite; }
    @keyframes rise { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-7px); } }
    @keyframes transmit { to { stroke-dashoffset:-48; } }
    @keyframes glow { 0%,100% { opacity:.45; } 50% { opacity:1; } }
    @media (prefers-reduced-motion: reduce) { .upper,.signal,.cursor { animation:none; } }
  </style>
  <g clip-path="url(#rounded)">
    <rect width="1200" height="440" fill="url(#background)"/>
    <rect x="737" width="463" height="440" fill="url(#grid)"/>
    <path d="M738 32V408" stroke="#ced6cd"/>
    <path d="M738 32h14M738 408h14" stroke="#7b8b78"/>
    <rect x="52" y="42" width="26" height="26" rx="7" fill="#3b6a14"/>
    <path d="m60 50-4 5 4 5m10-10 4 5-4 5m-4-12-2 14" fill="none" stroke="#f6ffe8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="mono" x="91" y="60" fill="#4f6255" font-size="13" letter-spacing="2">BASIT SHAHID / SOFTWARE ENGINEERING</text>
    <text class="sans" x="48" y="166" fill="#152a23" font-size="85" font-weight="700" letter-spacing="-4">Abdul Basit</text>
    <text class="sans" x="48" y="253" fill="#152a23" font-size="92" font-weight="700" letter-spacing="-4">Shahid<tspan fill="#3b6a14">.</tspan></text>
    <text class="sans" x="53" y="304" fill="#4f6255" font-size="24" letter-spacing="-.4">Backend thinker. Deliberate builder.</text>
    <g class="mono" font-size="12" letter-spacing="1.2">
      <rect x="53" y="331" width="8" height="8" rx="2" fill="#3b6a14"/>
      <text x="72" y="340" fill="#3b6a14">LARAVEL / PHP</text>
      <path d="M218 329v14" stroke="#a1afa0"/>
      <text x="238" y="340" fill="#3d6e9c">PROBLEM SOLVING</text>
    </g>
    <text class="mono" x="771" y="57" fill="#657b67" font-size="11" letter-spacing="2">THINK IN LAYERS. BUILD WITH INTENT.</text>
    <g transform="translate(778 77)">
      <path d="M-6 233 186 143 378 233 186 323Z" fill="none" stroke="#bacabc" stroke-dasharray="3 7"/>
      <path d="M-6 233 186 323 378 233" fill="none" stroke="#97b086" stroke-opacity=".5"/>
      <!-- Data plane: a stable foundation. -->
      <path d="M35 209 190 282 341 211v14l-151 71-155-73Z" fill="#c8d5c7" stroke="#8eaa93"/>
      <path d="M35 209 186 138 341 211 190 282Z" fill="url(#surface)" stroke="#739b87" stroke-width="1.2"/>
      <path d="m65 209 124 58 121-57M84 200l105 49 103-48" fill="none" stroke="#3d6e9c" stroke-opacity=".23"/>
      <path d="M71 225v7m12-1v7m12-1v7" stroke="#3d6e9c" stroke-width="2"/>
      <path class="signal" d="M190 282v29" fill="none" stroke="#3b6a14" stroke-width="2" stroke-dasharray="3 5"/>
      <!-- Logic plane: the bright centre of the system. -->
      <path d="M35 144 190 217 341 146v14l-151 71-155-73Z" fill="#78974c" stroke="#648f2c"/>
      <path d="M35 144 186 73 341 146 190 217Z" fill="url(#core)" stroke="#d4ed96" stroke-width="1.2"/>
      <path d="m69 144 117-55 121 57-117 55Z" fill="none" stroke="#e4f8c3" stroke-opacity=".45"/>
      <path d="m118 142 26-12m-26 12 26 12m92-12-26-12m26 12-26 12m-23-23-26 23" fill="none" stroke="#f2ffdd" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="m70 165 40 19m8 4 14 6" stroke="#f2ffdd" stroke-width="2" stroke-linecap="round"/>
      <!-- Interface plane: an open window over the application. -->
      <g class="upper">
        <path d="M35 79 190 152 341 81v12l-151 71-155-73Z" fill="#d6e2d9" stroke="#8ca696"/>
        <path d="M35 79 186 8 341 81 190 152Z" fill="url(#surface)" stroke="#3d6e9c" stroke-width="1.2"/>
        <path d="m91 79 95-44 97 46-95 44Z" fill="#eff5ec" stroke="#3d6e9c" stroke-opacity=".65"/>
        <path d="m109 87 94-44M124 73l13 6m-3-11 13 6m-3-11 13 6" fill="none" stroke="#3d6e9c" stroke-opacity=".6" stroke-width="2" stroke-linecap="round"/>
        <path d="m143 91 39-18 18 8-39 18Z" fill="#3d6e9c" fill-opacity=".5"/>
        <path d="m174 106 39-18 18 8-39 18Z" fill="#3d6e9c" fill-opacity=".18"/>
        <path class="cursor" d="m205 72 15-7 15 7-15 7Z" fill="#3b6a14"/>
      </g>
      <g class="mono" font-size="10" letter-spacing="1.4">
        <path d="M35 79H4" fill="none" stroke="#3d6e9c"/><text x="1" y="68" fill="#3f6f8c">01</text>
        <path d="M341 146h25" fill="none" stroke="#3b6a14"/><text x="351" y="135" fill="#3b6a14">02</text>
        <path d="M35 209H4" fill="none" stroke="#3d6e9c"/><text x="1" y="198" fill="#3f6f8c">03</text>
      </g>
    </g>
    <path d="M53 377H688M770 377h378" stroke="#ced6cd"/>
    <g class="mono" font-size="11" letter-spacing="1.3">
      <text x="53" y="409" fill="#657b67">LAHORE, PAKISTAN</text>
      <text x="688" y="409" text-anchor="end" fill="#4f6255">CODE WITH PURPOSE ↗</text>
      <text x="770" y="409" fill="#657b67">INTERFACE</text>
      <path d="M856 405h18m-4-3 4 3-4 3" fill="none" stroke="#7c907c"/>
      <text x="887" y="409" fill="#3b6a14">LOGIC</text>
      <path d="M946 405h18m-4-3 4 3-4 3" fill="none" stroke="#7c907c"/>
      <text x="978" y="409" fill="#657b67">DATA</text>
      <circle cx="1139" cy="405" r="4" fill="#3b6a14"/>
    </g>
  </g>
</svg>
