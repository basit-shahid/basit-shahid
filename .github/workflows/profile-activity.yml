name: Refresh profile activity

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_profile_activity.py
      - .github/workflows/profile-activity.yml

permissions:
  contents: write

concurrency:
  group: profile-activity
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Render first-party GitHub activity assets
        run: python3 scripts/update_profile_activity.py
      - name: Commit refreshed SVGs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/contribution-calendar.svg assets/activity-milestones.svg
          if git diff --cached --quiet; then
            echo 'Activity assets are already current.'
            exit 0
          fi
          git commit -m 'Refresh profile activity assets'
          git push origin HEAD:main
